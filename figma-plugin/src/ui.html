<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Copy for Nootles</title>
    <style>
      /* The window is Figma's, so the chrome wears Figma's theme tokens; the
         fallbacks are Figma's light values, for a preview outside the plugin
         sandbox. Nootles itself appears only as its own mark. */
      :root {
        color-scheme: light dark;
        --bg: var(--figma-color-bg, #ffffff);
        --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
        --bg-hover: var(--figma-color-bg-hover, #f0f0f0);
        --bg-brand: var(--figma-color-bg-brand, #0d99ff);
        --bg-brand-hover: var(--figma-color-bg-brand-hover, #0b8ce9);
        --bg-disabled: var(--figma-color-bg-disabled, #e6e6e6);
        --border: var(--figma-color-border, #e6e6e6);
        --border-strong: var(--figma-color-border-strong, #2c2c2c);
        --text: var(--figma-color-text, #1e1e1e);
        --text-secondary: var(--figma-color-text-secondary, #757575);
        --text-tertiary: var(--figma-color-text-tertiary, #b3b3b3);
        --text-onbrand: var(--figma-color-text-onbrand, #ffffff);
        --text-disabled: var(--figma-color-text-disabled, #b3b3b3);
        --text-success: var(--figma-color-text-success, #14ae5c);
        --text-danger: var(--figma-color-text-danger, #f24822);
        --text-warning: var(--figma-color-text-warning, #a35e00);
        --icon: var(--figma-color-icon, #1e1e1e);
        --icon-tertiary: var(--figma-color-icon-tertiary, #b3b3b3);
        --nootles: #718568;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font: 11px/16px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      button,
      a {
        font: inherit;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--bg-brand);
        outline-offset: 1px;
      }

      /* ---- Header ------------------------------------------------------ */
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 40px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }
      .wordmark {
        display: block;
        height: 16px;
        width: auto;
        color: var(--text);
      }
      .head .kicker {
        color: var(--text-tertiary);
        letter-spacing: 0.02em;
      }

      /* ---- Body -------------------------------------------------------- */
      .body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
      }
      .card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-secondary);
        min-height: 60px;
      }
      .card .mark {
        flex: none;
        width: 28px;
        height: 34px;
        color: var(--nootles);
      }
      .card.is-empty .mark {
        color: var(--icon-tertiary);
      }
      .card .words {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .card .name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .meta {
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .primary {
        appearance: none;
        border: 0;
        border-radius: 6px;
        height: 32px;
        padding: 0 16px;
        font-weight: 500;
        color: var(--text-onbrand);
        background: var(--bg-brand);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: background 120ms;
      }
      .primary:hover:not(:disabled) {
        background: var(--bg-brand-hover);
      }
      .primary:disabled {
        background: var(--bg-disabled);
        color: var(--text-disabled);
        cursor: default;
      }
      .primary kbd {
        font: inherit;
        opacity: 0.7;
      }
      .primary .spinner {
        width: 12px;
        height: 12px;
        border: 1.5px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .status {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        min-height: 16px;
        color: var(--text-secondary);
      }
      .status svg {
        flex: none;
        width: 12px;
        height: 12px;
        margin-top: 2px;
      }
      .status:empty {
        display: none;
      }
      .status.is-ok {
        color: var(--text-success);
      }
      .status.is-problem {
        color: var(--text-danger);
      }

      /* ---- Notes: what the canvas could not hold ------------------------ */
      .notes {
        flex: 1;
        min-height: 0;
        display: none;
        flex-direction: column;
        gap: 6px;
      }
      .notes.is-shown {
        display: flex;
      }
      .notes h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .notes h2 .count {
        font-weight: 500;
        color: var(--text-tertiary);
      }
      .notes ul {
        margin: 0;
        padding: 0;
        list-style: none;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .notes li {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 8px;
        padding: 6px 10px;
        color: var(--text-secondary);
      }
      .notes li + li {
        border-top: 1px solid var(--border);
      }
      .notes li b {
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ---- Footer ------------------------------------------------------ */
      .foot {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        color: var(--text-secondary);
      }
      .foot .quiet {
        appearance: none;
        border: 0;
        background: none;
        padding: 0;
        color: var(--text-secondary);
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .foot .quiet:hover {
        color: var(--text);
      }
      .foot .quiet[hidden] {
        display: none;
      }
      textarea {
        position: absolute;
        left: -9999px;
        top: 0;
      }
    </style>
  </head>

      <p class="status" id="status"></p>

      <section class="notes" id="notes" aria-live="polite">
        <h2>Carried with changes <span class="count" id="count"></span></h2>
        <ul id="report"></ul>
      </section>
    </main>

    <footer class="foot">
      <span>Paste onto a canvas with ⌘V.</span>
      <button class="quiet" id="details" hidden title="What the converter saw and wrote, for a report about a paste that landed wrong">Copy bug details</button>
    </footer>
    <textarea id="scratch" aria-hidden="true" tabindex="-1"></textarea>

    <script>
      const $ = (id) => document.getElementById(id);
      const card = $("card");
      const button = $("copy");
      const label = $("label");
      const status = $("status");
      const notes = $("notes");
      const report = $("report");
      const detailsButton = $("details");

      let count = 0;
      let busy = false;
      let details = "";

      const ICONS = {
        ok: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg>',
        problem: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6" cy="6" r="4.75"/><path d="M6 3.5v3M6 8.25v.25"/></svg>',
      };

      const say = (text, tone) => {
        status.className = "status" + (tone ? " is-" + tone : "");
        status.innerHTML = "";
        if (!text) return;
        if (tone && ICONS[tone]) status.insertAdjacentHTML("beforeend", ICONS[tone]);
        status.append(document.createTextNode(text));
      };

      const setBusy = (next) => {
        busy = next;
        button.disabled = busy || count === 0;
        label.innerHTML = busy ? '<span class="spinner" aria-hidden="true"></span> Reading the selection…' : copyLabel();
      };
      const copyLabel = () => (count > 1 ? `Copy ${count} layers` : "Copy");

      // The clipboard from an iframe: the modern API first, the old one when
      // the sandbox withholds it — which the plugin window sometimes does.
      const toClipboard = async (text) => {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {}
        const scratch = $("scratch");
        scratch.value = text;
        scratch.focus();
        scratch.select();
        try {
          return document.execCommand("copy");
        } catch {
          return false;
        } finally {
          scratch.value = "";
        }
      };

      // A copy's notes describe that copy; a new selection or a new copy starts clean.
      const clear = () => {
        say("");
        notes.classList.remove("is-shown");
        report.replaceChildren();
        detailsButton.hidden = true;
      };

      const copy = () => {
        if (button.disabled) return;
        clear();
        parent.postMessage({ pluginMessage: { type: "copy" } }, "*");
      };
      button.onclick = copy;

      // What the converter saw and what it wrote, for a report about a paste
      // that landed wrong. Nothing leaves the clipboard on its own.
      detailsButton.onclick = async () => {
        const ok = await toClipboard(details);
        say(ok ? "Details copied. Paste them into the bug report." : "The clipboard would not take it.", ok ? "ok" : "problem");
      };

      // Enter copies, Escape closes: the two things a hand on the keyboard means.
      window.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.metaKey && !event.ctrlKey) {
          event.preventDefault();
          copy();
        } else if (event.key === "Escape") {
          parent.postMessage({ pluginMessage: { type: "close" } }, "*");
        }
      });

      window.onmessage = async (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        switch (message.type) {
          case "selection": {
            count = message.count;
            if (message.version) $("kicker").textContent = `Copy for Figma · v${message.version}`;
            if (!busy) clear();
            card.classList.toggle("is-empty", count === 0);
            if (count === 0) {
              $("name").textContent = "Nothing selected";
              $("meta").textContent = "Select layers in the file to copy them.";
            } else {
              const [first, ...rest] = message.names;
              $("name").textContent = first;
              $("meta").textContent =
                count === 1
                  ? "1 layer"
                  : count === 2
                    ? `and ${rest[0]}`
                    : `and ${count - 1} more, ${rest.slice(0, 2).join(", ")}${count > 3 ? "…" : ""}`;
            }
            if (!busy) setBusy(false);
            break;
          }
          case "busy":
            setBusy(true);
            break;
          case "failed":
            setBusy(false);
            say(message.message, "problem");
            break;
          case "ready": {
            setBusy(false);
            const ok = await toClipboard(message.html);
            if (!ok) {
              say("The clipboard would not take it. Click the plugin window and try again.", "problem");
              break;
            }
            const shapes = message.count === 1 ? "1 shape" : `${message.count} shapes`;
            say(`Copied ${shapes}. Paste onto a Nootles canvas.`, "ok");
            details = message.details;
            detailsButton.hidden = false;
            const lines = message.report;
            notes.classList.toggle("is-shown", lines.length > 0);
            $("count").textContent = lines.length ? String(lines.length) : "";
            report.replaceChildren(
              ...lines.map((line) => {
                const li = document.createElement("li");
                const name = document.createElement("b");
                name.textContent = line.name;
                name.title = line.name;
                const text = document.createElement("span");
                text.textContent = line.message;
                li.append(name, text);
                return li;
              }),
            );
            break;
          }
        }
      };
    </script>
  </body>
</html>
