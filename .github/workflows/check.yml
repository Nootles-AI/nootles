name: check

# Static, semantic and isolated real-browser canvas gates. No deployment or AI keys.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # convex/_generated is committed, so typechecking needs no deployment.
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:canvas:browser
        env:
          CANVAS_BROWSER_CHANNEL: chromium
